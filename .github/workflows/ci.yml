name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev libx11-dev \
            libxtst-dev libevdev-dev libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      # Cargo.lock pins the exact dependency versions. Download it from this run
      # (Summary page -> Artifacts) and commit it to the repository once, so that
      # releases are built from the same versions you tested.
      - name: Save Cargo.lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  linux-ime:
    # The Linux input method (Python): its own tests, plus a check that the .deb builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 linux/tests/test_engine.py
      - name: Tables are generated from mapping.rs
        run: python3 linux/tools/gen_tables.py src/mapping.rs | diff - linux/kvtables.py
      - run: bash linux/build_deb.sh
